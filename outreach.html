<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyCena — LinkedIn Outreach</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#eeede8;
  --text:#1a1a18;--text2:#6b6b66;--text3:#9b9b96;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --purple:#7F77DD;--purple-bg:#EEEDFE;--purple-text:#26215C;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#04342C;
  --amber-bg:#FAEEDA;--amber-text:#412402;
  --red-bg:#FCEBEB;--red-text:#501313;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
  --text:#e8e6de;--text2:#9b9996;--text3:#6b6b66;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --purple-bg:#26215C;--purple-text:#CECBF6;
  --green-bg:#04342C;--green-text:#9FE1CB;
  --amber-bg:#412402;--amber-text:#FAC775;
  --red-bg:#501313;--red-text:#F09595;
}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--text);font-size:14px;min-height:100vh;}
.app{max-width:960px;margin:0 auto;padding:20px;}
.header{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px;}
.logo{width:28px;height:28px;border-radius:7px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--green-bg);color:var(--green-text);font-weight:500;}
.tabs{display:flex;gap:6px;}
.tab{font-size:12px;padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;}
.tab.active{background:var(--green);color:white;border-color:var(--green);}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.metric{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;cursor:pointer;}
.metric.active{background:var(--green-bg);}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:3px;}
.metric-value{font-size:22px;font-weight:500;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:10px;}
.bar{display:flex;align-items:center;gap:10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:14px;}
.progress-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;}
.progress-fill{height:100%;border-radius:2px;transition:width 0.3s;}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
input[type=text],input[type=file],select,textarea{font-size:13px;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);font-family:inherit;width:100%;}
.search{width:220px;}
.btn{font-size:12px;padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-primary{background:var(--green);color:white;border-color:var(--green);}
.btn-purple{background:var(--purple);color:white;border-color:var(--purple);}
.btn-blue{background:#0A66C2;color:white;border-color:#0A66C2;}
.btn-crm{background:#639922;color:white;border-color:#639922;}
.btn-sm{font-size:11px;padding:3px 9px;border-radius:5px;}
.btn:disabled{opacity:0.6;cursor:wait;}
.contact-row{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;overflow:hidden;}
.contact-row.open{border-color:var(--green);}
.contact-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;}
.contact-header:hover{background:var(--bg2);}
.tier-badge{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:500;flex-shrink:0;}
.contact-name{font-size:13px;font-weight:500;}
.contact-sub{font-size:11px;color:var(--text2);}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--bg2);color:var(--text2);white-space:nowrap;}
.status-pill{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500;white-space:nowrap;}
.mini-badge{font-size:10px;padding:1px 5px;border-radius:3px;}
.contact-body{border-top:0.5px solid var(--border);padding:14px;}
.status-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.status-item{display:flex;flex-direction:column;align-items:center;gap:2px;}
.status-btn{font-size:11px;padding:4px 10px;border-radius:5px;border:0.5px solid var(--border2);cursor:pointer;font-family:inherit;background:var(--bg2);color:var(--text2);}
.status-btn.active{font-weight:500;}
.status-date{font-size:10px;color:var(--text3);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sec-title{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;}
.sec-sub{font-size:11px;color:var(--text3);font-weight:400;}
.brief-text{font-size:12px;line-height:1.7;white-space:pre-wrap;}
.note-box{font-size:13px;line-height:1.7;padding:10px;background:var(--bg2);border-radius:var(--radius);margin-bottom:6px;}
.sent-box{font-size:12px;line-height:1.6;padding:8px 10px;background:var(--bg2);border-radius:var(--radius);margin-bottom:6px;border-left:2px solid var(--green);}
.char-count{font-size:11px;color:var(--text3);margin-bottom:8px;}
.char-count.over{color:#E24B4A;}
.divider{margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border);}
.promote-bar{margin-top:14px;padding-top:12px;border-top:0.5px solid var(--border);}
.promote-hint{font-size:11px;color:var(--text3);text-align:center;margin-top:4px;}
.in-crm{margin-top:12px;font-size:12px;padding:8px 12px;border-radius:var(--radius);background:#EAF3DE;color:#27500A;}
.empty{font-size:13px;color:var(--text3);padding:40px;text-align:center;}
.alert-green{font-size:12px;padding:8px 12px;border-radius:var(--radius);margin-bottom:12px;background:var(--green-bg);color:var(--green-text);border-left:3px solid var(--green);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle;}
.spinner-dark{border-color:rgba(0,0,0,0.1);border-top-color:var(--text2);}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:20px;right:20px;background:#1D9E75;color:white;font-size:12px;padding:8px 14px;border-radius:var(--radius);font-family:inherit;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
@media(max-width:600px){.metrics{grid-template-columns:repeat(3,1fr);}.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty"><span class="spinner spinner-dark"></span> Loading...</div></div>
<div class="toast" id="toast"></div>
<script>
var SUPABASE = "https://mycena-crm-proxy.julia-aa4.workers.dev";
var PROXY = "https://mycena-crm-proxy.julia-aa4.workers.dev/anthropic";
var FOUNDER = "Julia";

var STATUS_FLOW = ["Not sent","Note sent","Connected","Replied","Booked","Irrelevant"];
var STATUS_STYLE = {
  "Not sent":{bg:"var(--bg2)",text:"var(--text3)"},
  "Note sent":{bg:"var(--purple-bg)",text:"var(--purple-text)"},
  "Connected":{bg:"#E6F1FB",text:"#042C53"},
  "Replied":{bg:"var(--amber-bg)",text:"var(--amber-text)"},
  "Booked":{bg:"var(--green-bg)",text:"var(--green-text)"},
  "Irrelevant":{bg:"var(--bg3)",text:"var(--text3)"}
};
var TS_FIELD = {"Note sent":"note_sent_at","Connected":"connected_at","Replied":"replied_at","Booked":"booked_at"};
var SECTOR_MAP = {
  "financial services":"Financial services","banking":"Financial services","insurance":"Financial services",
  "bpo":"BPO","business process outsourcing":"BPO","outsourcing":"BPO",
  "msp":"MSP","managed service":"MSP","it services":"MSP",
  "healthcare":"Healthcare","hospital":"Healthcare","medical":"Healthcare",
  "government":"Government/Defence","defence":"Government/Defence","defense":"Government/Defence","public sector":"Government/Defence",
  "retail":"Retail","ecommerce":"Retail","manufacturing":"Manufacturing","industrial":"Manufacturing",
  "logistics":"Logistics","supply chain":"Logistics","professional services":"Professional services",
  "consulting":"Professional services","technology":"Technology","software":"Technology","saas":"Technology",
  "critical infrastructure":"Critical infrastructure","energy":"Critical infrastructure","utilities":"Critical infrastructure"
};
var ICP_TITLES = ["ciso","chief information security officer","vp information security","director information security","head of cybersecurity","head of information security","vp it","cto","chief technology officer","it director","it manager","head of it","risk","compliance"];

var state = {
  view:"import",contacts:[],parsed:[],search:"",filterTier:"All",filterStatus:"All",
  showIrrelevant:false,expanded:null,phase:"",progress:0,
  importing:false,imported:false,importedCount:0,skippedCount:0,
  batchRunning:false,batchDone:0,batchTotal:0,batchCurrent:"",loadingId:null
};

function ef(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uf(s){ return (s||"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"'); }
function fd(iso){ return iso?new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):""; }
function mapSec(ind){
  var l=(ind||"").toLowerCase();
  for(var k in SECTOR_MAP){ if(l.indexOf(k)>=0) return SECTOR_MAP[k]; }
  return "Other";
}
function mapHC(n){ return !n?"500-2k":n<500?"<500":n<2000?"500-2k":n<10000?"2k-10k":"10k+"; }
function calcScore(r){
  var s=0, t=(r["Title"]||"").toLowerCase();
  for(var i=0;i<ICP_TITLES.length;i++){ if(t.indexOf(ICP_TITLES[i])>=0){s+=3;break;} }
  var sec=mapSec(r["Industry"]||"");
  if(["Financial services","BPO","MSP","Critical infrastructure","Healthcare","Government/Defence"].indexOf(sec)>=0) s+=2;
  var n=parseInt(r["# Employees"])||0;
  if(n>=500&&n<10000) s+=1;
  if(r["Person Linkedin Url"]) s+=1;
  return s;
}
function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); },2500);
}
function dbReq(path,opts){
  opts=opts||{};
  return fetch(SUPABASE+"/"+path,{
    method:opts.method||"GET",
    headers:{"Content-Type":"application/json","Prefer":opts.prefer!==undefined?opts.prefer:"return=representation"},
    body:opts.body
  }).then(function(r){ return r.status===204?null:r.json(); });
}
function aiReq(prompt,sys){
  var body={model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:prompt}]};
  if(sys) body.system=sys;
  return fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){return (d.content&&d.content[0]&&d.content[0].text)||"";});
}
function loadContacts(){
  state.phase="Loading contacts..."; render();
  dbReq("contacts?order=icp_score.desc,created_at.desc&limit=2000",{prefer:""})
    .then(function(d){state.contacts=Array.isArray(d)?d:[];})
    .catch(function(){state.contacts=[];})
    .then(function(){state.phase="";render();});
}
function parseCSV(txt){
  var lines=txt.split("\n").filter(function(l){return l.trim();});
  var hdrs=lines[0].split(",").map(function(h){return h.replace(/^"|"$/g,"").trim();});
  return lines.slice(1).map(function(line){
    var vals=[],cur="",inQ=false;
    for(var i=0;i<line.length;i++){
      var ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===","&&!inQ){vals.push(cur.trim());cur="";}
      else cur+=ch;
    }
    vals.push(cur.trim());
    var row={};
    hdrs.forEach(function(h,i){row[h]=(vals[i]||"").replace(/^"|"$/g,"");});
    return row;
  }).filter(function(r){return r["First Name"]||r["Last Name"];});
}
function onFile(ev){
  var file=ev.target.files&&ev.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e2){
    var rows=parseCSV(e2.target.result);
    state.parsed=rows.map(function(r,i){
      var sc=calcScore(r);
      return {
        _pid:i,first_name:r["First Name"]||"",last_name:r["Last Name"]||"",
        contact_name:((r["First Name"]||"")+" "+(r["Last Name"]||"")).trim(),
        title:r["Title"]||"",company:r["Company Name"]||"",
        sector:mapSec(r["Industry"]||""),headcount:mapHC(parseInt(r["# Employees"])||0),
        linkedin_url:r["Person Linkedin Url"]||"",email:r["Email"]||"",
        country:r["Country"]||"",industry_raw:r["Industry"]||"",
        keywords:r["Keywords"]||"",icp_tier:sc>=5?"1":sc>=3?"2":"3",
        icp_score:sc,source:"Apollo",outreach_status:"Not sent",
        agent08_brief:"",linkedin_note:"",notes:"",supabase_id:null
      };
    }).sort(function(a,b){return b.icp_score-a.icp_score;});
    state.imported=false; render();
  };
  reader.readAsText(file);
}
function importContacts(){
  state.importing=true; state.phase="Checking existing..."; state.progress=0; render();
  dbReq("contacts?select=id,company,contact_name&limit=2000",{prefer:""})
    .then(function(ex){
      ex=ex||[];
      var map={};
      ex.forEach(function(d){
        map[(d.company||"").toLowerCase().trim()+"|"+(d.contact_name||"").toLowerCase().trim()]=d.id;
      });
      var upd=state.parsed.slice(),nc=0,lc=0,i=0;
      state.phase="Importing..."; render();
      function nx(){
        if(i>=upd.length){
          state.parsed=upd; state.importing=false; state.imported=true;
          state.importedCount=nc; state.skippedCount=lc; state.phase=""; render(); return;
        }
        var c=upd[i];
        var k=c.company.toLowerCase().trim()+"|"+c.contact_name.toLowerCase().trim();
        if(map[k]){
          upd[i]=Object.assign({},c,{supabase_id:map[k]}); lc++;
          state.progress=Math.round(((i+1)/upd.length)*100); render(); i++; nx();
        } else {
          dbReq("contacts",{method:"POST",body:JSON.stringify({
            first_name:c.first_name,last_name:c.last_name,contact_name:c.contact_name,
            title:c.title,company:c.company,sector:c.sector,headcount:c.headcount,
            linkedin_url:c.linkedin_url,email:c.email,country:c.country,
            industry_raw:c.industry_raw,keywords:c.keywords,
            icp_tier:c.icp_tier,icp_score:c.icp_score,source:c.source,
            outreach_status:"Not sent",notes:""
          })}).then(function(d){
            if(d&&d[0]&&d[0].id) upd[i]=Object.assign({},c,{supabase_id:d[0].id});
            nc++;
          }).catch(function(){}).then(function(){
            state.progress=Math.round(((i+1)/upd.length)*100); render(); i++; nx();
          });
        }
      }
      nx();
    });
}
function saveBN(sid,brief,note){
  if(!sid) return Promise.resolve();
  return dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",
    body:JSON.stringify({agent08_brief:brief||"",linkedin_note:note||""})});
}
function updateStatus(sid,status){
  var tf=TS_FIELD[status], patch={outreach_status:status};
  if(tf) patch[tf]=new Date().toISOString();
  dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify(patch)})
    .then(function(){
      state.contacts=state.contacts.map(function(c){return c.id===sid?Object.assign({},c,patch):c;});
      render();
    });
}
function promoteToDeal(sid){
  state.loadingId="promote_"+sid; render();
  var c=state.contacts.filter(function(x){return x.id===sid;})[0];
  if(!c){state.loadingId=null;render();return;}
  var notes=[
    c.linkedin_url?"LinkedIn: "+c.linkedin_url:"",
    c.agent08_brief?"\n--- Agent 08 ---\n"+c.agent08_brief:"",
    c.notes?"\n--- Notes ---\n"+c.notes:""
  ].filter(Boolean).join("\n").trim();
  dbReq("deals",{method:"POST",body:JSON.stringify({
    company:c.company,contact_name:c.contact_name,title:c.title,
    sector:c.sector,headcount:c.headcount,stage:"Contacted",
    control_ladder:"2 — Aware but undefended",risk:"GREEN",deal_value:0,
    icp_tier:c.icp_tier,source:"Inbound",days_since_activity:0,
    last_activity:"Promoted from contacts — "+c.outreach_status,notes:notes
  })}).then(function(d){
    var did=d&&d[0]&&d[0].id;
    if(did){
      return dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({deal_id:did})})
        .then(function(){
          state.contacts=state.contacts.map(function(x){return x.id===sid?Object.assign({},x,{deal_id:did}):x;});
          showToast("✓ "+c.contact_name+" promoted to CRM");
        });
    }
  }).catch(function(){showToast("Promote failed");})
  .then(function(){state.loadingId=null;render();});
}
function runAgent08(sid){
  state.loadingId="brief_"+sid; render();
  var c=state.contacts.filter(function(x){return x.id===sid;})[0];
  if(!c){state.loadingId=null;render();return;}
  var p="You are MyCena Sales Research Agent 08. Pre-outreach brief.\n"
    +"Company: "+c.company+" | Sector: "+c.sector+" | Contact: "+c.contact_name+", "+c.title+"\n"
    +"Headcount: "+c.headcount+" | Country: "+c.country+" | Keywords: "+(c.keywords||"none")+"\n"
    +"Return: 1) Sector breach + relevance 2) Control Ladder position + why 3) Top objection + response 4) Why MyCena matters now 5) LinkedIn opening angle under 30 words no product name. No jargon.";
  aiReq(p).then(function(brief){
    state.contacts=state.contacts.map(function(x){return x.id===sid?Object.assign({},x,{agent08_brief:brief}):x;});
    return saveBN(sid,brief,c.linkedin_note||"");
  }).then(function(){showToast("Brief saved");state.loadingId=null;render();});
}
function generateNote(sid){
  state.loadingId="note_"+sid; render();
  var c=state.contacts.filter(function(x){return x.id===sid;})[0];
  if(!c){state.loadingId=null;render();return;}
var p="You are writing a LinkedIn message on behalf of "+FOUNDER+", co-founder of MyCena, sent after a connection is accepted.\n"
    +"Contact: "+c.contact_name+", "+c.title+" at "+c.company+"\n"
    +"Sector: "+c.sector+" | Country: "+c.country+" | Keywords: "+(c.keywords||"none")+"\n"
+(c.agent08_brief?"Key pain angle: "+c.agent08_brief.split("\n")[0]+"\n":"")
  +(c.linkedin_note?"Connection note sent:\n"+c.linkedin_note+"\n":"")
    +"Write a short LinkedIn message. STRICT 60 word maximum excluding the sign-off.\n"
    +"Structure: one warm opener specific to them. One plain observation about a pain someone in their role would recognise immediately. One short easy question they can answer in one sentence.\n"
    +"If your draft exceeds 60 words rewrite it shorter. Count every word before responding.\n"
  +"End with just: "+FOUNDER+"\n"
    +"Never mention MyCena or any product. Never use: regulatory nightmares, blind spot, scale operations, sensitive environments, complex landscape, leverage, seamless, would love to, I wanted to reach out.\n"
    +"No deck no link. Tone: founder to peer — warm and direct. Goal: one reply.";
  aiReq(p,"Return only the note. No preamble no labels no quotes.")
    .then(function(note){
      state.contacts=state.contacts.map(function(x){return x.id===sid?Object.assign({},x,{linkedin_note:note}):x;});
      return saveBN(sid,c.agent08_brief||"",note);
    }).then(function(){showToast("Note saved");state.loadingId=null;render();});
}
function generateFollowUp(sid){
  state.loadingId="followup_"+sid; render();
  var c=state.contacts.filter(function(x){return x.id===sid;})[0];
  if(!c){state.loadingId=null;render();return;}
 var p="You are writing a LinkedIn message on behalf of "+FOUNDER+", co-founder of MyCena, sent after a connection is accepted.\n"
    +"Contact: "+c.contact_name+", "+c.title+" at "+c.company+"\n"
    +"Sector: "+c.sector+" | Country: "+c.country+" | Keywords: "+(c.keywords||"none")+"\n"
    +(c.agent08_brief?"Key pain angle: "+c.agent08_brief.split("\n")[0]+"\n":"")
    +(c.linkedin_note?"Connection note sent:\n"+c.linkedin_note+"\n":"")
    +"Write a LinkedIn message. STRICT 60 word maximum excluding sign-off.\n"
    +"Structure:\n"
    +"- Line 1: warm opener with their first name and a dash. One specific genuine observation about their company or role — never Thanks for connecting.\n"
    +"- Line 2: one plain sentence describing a specific pain a BPO IT leader serving healthcare or finance clients would immediately recognise. Make it concrete not abstract.\n"
    +"- Line 3: one sentence hinting you have worked on this problem — do not name the product or describe it. End with a soft warm closing like: Happy to share what we have found if it is useful. Or: Might be relevant to what you are dealing with.\n"
    +"- Final line: just the name "+FOUNDER+"\n"
    +"Never mention MyCena or any product by name. Never use: regulatory, blind spot, scale operations, sensitive environments, complex landscape, leverage, seamless, would love to, worth a conversation.\n"
    +"No deck no link. Tone: founder to peer — warm specific direct. Goal: a reply not a meeting.\n"
    +"Count every word before responding. If over 60 words rewrite shorter.";
  aiReq(p,"Return only the message. No preamble no labels no quotes.")
    .then(function(msg){
      state.contacts=state.contacts.map(function(x){return x.id===sid?Object.assign({},x,{followup_msg:msg}):x;});
      return dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({followup_msg:msg})});
    }).then(function(){showToast("Message ready");state.loadingId=null;render();});
}
function markNoteSent(sid){
  var el=document.getElementById("ns-"+sid);
  if(!el||!el.value.trim()) return;
  var txt=el.value.trim(), ts=new Date().toISOString();
  dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({note_sent_text:txt,note_sent_at:ts})})
    .then(function(){
      state.contacts=state.contacts.map(function(c){return c.id===sid?Object.assign({},c,{note_sent_text:txt,note_sent_at:ts}):c;});
      showToast("Note logged"); render();
    });
}
function markFollowupSent(sid){
  var el=document.getElementById("fs-"+sid);
  if(!el||!el.value.trim()) return;
  var txt=el.value.trim(), ts=new Date().toISOString();
  dbReq("contacts?id=eq."+sid,{method:"PATCH",prefer:"return=minimal",body:JSON.stringify({followup_sent_text:txt,followup_sent_at:ts})})
    .then(function(){
      state.contacts=state.contacts.map(function(c){return c.id===sid?Object.assign({},c,{followup_sent_text:txt,followup_sent_at:ts}):c;});
      showToast("Message logged"); render();
    });
}
function clearSent(sid,field){
  var patch={};
  patch[field]="";
  state.contacts=state.contacts.map(function(c){return c.id===sid?Object.assign({},c,patch):c;});
  render();
}
function copyBtn(el){
  var txt=uf(el.getAttribute("data-text")||"");
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  showToast("Copied");
}
function runAllTier1(){
  var src=state.view==="import"?state.parsed:state.contacts;
  var t1=src.filter(function(c){return c.icp_tier==="1"&&!c.agent08_brief&&!c.linkedin_note;});
  if(!t1.length){showToast("All Tier 1 already briefed");return;}
  state.batchRunning=true; state.batchDone=0; state.batchTotal=t1.length; state.batchCurrent=""; render();
  var i=0;
  function nx(){
    if(i>=t1.length){
      state.batchDone=t1.length; state.batchRunning=false; state.batchCurrent="";
      showToast("Done — "+t1.length+" briefed"); render(); return;
    }
    var c=t1[i];
    state.batchCurrent=c.contact_name+" at "+c.company; state.batchDone=i; render();
    var bp="MyCena Sales Research Agent 08.\n"
      +"Company: "+c.company+" | Sector: "+c.sector+" | Contact: "+c.contact_name+", "+c.title+"\n"
      +"Headcount: "+c.headcount+" | Country: "+c.country+" | Keywords: "+(c.keywords||"none")+"\n"
      +"Return: 1) Sector breach 2) Control Ladder 3) Objection + response 4) Why MyCena now 5) LinkedIn angle. Specific no jargon.";
    aiReq(bp).then(function(brief){
      var np="LinkedIn connection note for "+FOUNDER+" co-founder of MyCena.\n"
        +"Contact: "+c.contact_name+", "+c.title+" at "+c.company+" | Sector: "+c.sector+"\n"
        +"Brief: "+brief+"\n"
        +"STRICT 200 character max. No product name. Specific reference. No deck/link. Peer-to-peer. Start with first name. Rewrite if over 200 chars.";
      return aiReq(np,"Return only the note. No preamble.").then(function(note){
        var sid=c.id||c.supabase_id;
        if(state.view==="import"){
          state.parsed=state.parsed.map(function(x){return x._pid===c._pid?Object.assign({},x,{agent08_brief:brief,linkedin_note:note}):x;});
        } else {
          state.contacts=state.contacts.map(function(x){return x.id===sid?Object.assign({},x,{agent08_brief:brief,linkedin_note:note}):x;});
        }
        if(sid) return saveBN(sid,brief,note);
      });
    }).then(function(){render();i++;nx();});
  }
  nx();
}
function filtered(){
  var src=state.view==="import"?state.parsed:state.contacts;
  var q=state.search.toLowerCase();
  return src.filter(function(c){
    var mQ=!q||(c.contact_name||"").toLowerCase().indexOf(q)>=0||(c.company||"").toLowerCase().indexOf(q)>=0||(c.title||"").toLowerCase().indexOf(q)>=0;
    var mT=state.filterTier==="All"||c.icp_tier===state.filterTier;
    var mS=state.filterStatus==="All"||(c.outreach_status||"Not sent")===state.filterStatus;
    var mI=state.showIrrelevant||(c.outreach_status||"Not sent")!=="Irrelevant";
    return mQ&&mT&&mS&&mI;
  });
}
function tierStyle(t){
  return t==="1"?{bg:"#E1F5EE",text:"#1D9E75"}:t==="2"?{bg:"#FAEEDA",text:"#EF9F27"}:{bg:"#F1EFE8",text:"#888780"};
}
  function buildCard(c){
  var sid=c.id||c.supabase_id||"";
  var isOpen=state.expanded===sid||state.expanded===c._pid;
  var status=c.outreach_status||"Not sent";
  var ss=STATUS_STYLE[status]||STATUS_STYLE["Not sent"];
  var ts=tierStyle(c.icp_tier);
  var lBrief=state.loadingId==="brief_"+sid;
  var lNote=state.loadingId==="note_"+sid;
  var lFU=state.loadingId==="followup_"+sid;
  var lProm=state.loadingId==="promote_"+sid;
  var canPromote=!c.deal_id&&(status==="Connected"||status==="Replied"||status==="Booked")&&sid;
  var showFU=status==="Connected"||status==="Replied"||status==="Booked";
  var liUrl=c.linkedin_url?(c.linkedin_url.indexOf("http")===0?c.linkedin_url:"https://"+c.linkedin_url):"";
  var h="";

  h+='<div class="contact-row'+(isOpen?" open":"")+'">';
  h+='<div class="contact-header" onclick="toggleExpand(\''+sid+'\')">';
  h+='<span class="tier-badge" style="background:'+ts.bg+';color:'+ts.text+'">T'+ef(c.icp_tier)+'</span>';
  h+='<div style="flex:1;min-width:0">';
  h+='<div class="contact-name">'+ef(c.contact_name)+'</div>';
  h+='<div class="contact-sub">'+ef(c.title)+' · '+ef(c.company)+'</div>';
  h+='</div>';
  h+='<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap">';
  h+='<span class="tag">'+ef(c.sector)+'</span>';
  h+='<span class="tag">'+ef(c.headcount)+'</span>';
  h+='<span class="status-pill" style="background:'+ss.bg+';color:'+ss.text+'">'+ef(status)+'</span>';
  if(c.agent08_brief) h+='<span class="mini-badge" style="background:#E1F5EE;color:#04342C">briefed</span>';
  if(c.linkedin_note) h+='<span class="mini-badge" style="background:#EEEDFE;color:#26215C">note</span>';
  if(c.note_sent_at)  h+='<span class="mini-badge" style="background:#FAEEDA;color:#412402">sent '+fd(c.note_sent_at)+'</span>';
  if(c.followup_sent_at) h+='<span class="mini-badge" style="background:#E6F1FB;color:#042C53">msg '+fd(c.followup_sent_at)+'</span>';
  if(c.deal_id)       h+='<span class="mini-badge" style="background:#EAF3DE;color:#27500A">in CRM</span>';
  if(c.linkedin_url)  h+='<span style="font-size:11px;color:#0A66C2;font-weight:500">LI</span>';
  h+='</div>';
  h+='<span style="font-size:11px;color:var(--text3);margin-left:6px">'+(isOpen?"▲":"▼")+'</span>';
  h+='</div>';

  if(!isOpen){ h+='</div>'; return h; }

  h+='<div class="contact-body">';

  if(sid){
    h+='<div style="margin-bottom:14px"><div class="sec-title">Outreach status</div>';
    h+='<div class="status-btns">';
    for(var si=0;si<STATUS_FLOW.length;si++){
      var s=STATUS_FLOW[si];
      var act=status===s;
      var sst=STATUS_STYLE[s];
      var tf=TS_FIELD[s];
      var ds=tf&&c[tf]?fd(c[tf]):"";
      var bstyle=act?"background:"+sst.bg+";color:"+sst.text+";border-color:"+sst.text:"";
      h+='<div class="status-item">';
      h+='<button class="status-btn'+(act?" active":"")+'" style="'+bstyle+'" onclick="updateStatus(\''+sid+'\',\''+s+'\')">'+ef(s)+'</button>';
      if(ds) h+='<span class="status-date">'+ds+'</span>';
      h+='</div>';
    }
    h+='</div></div>';
  }

  h+='<div class="two-col">';

  h+='<div>';
  h+='<div class="sec-title">Agent 08 — Research brief</div>';
  if(c.agent08_brief){
    h+='<div class="brief-text">'+ef(c.agent08_brief)+'</div>';
  } else if(sid){
    h+='<button class="btn btn-primary" onclick="runAgent08(\''+sid+'\')" '+(state.loadingId?"disabled":"")+' style="width:100%">';
    h+=lBrief?'<span class="spinner"></span>Running...':"Run Agent 08 →";
    h+='</button>';
  } else {
    h+='<div style="font-size:12px;color:var(--text3)">Import contacts first.</div>';
  }
  h+='</div>';

  h+='<div>';
  h+='<div class="sec-title">Connection note <span class="sec-sub">(with request)</span></div>';
  if(c.linkedin_note){
    h+='<div class="note-box">'+ef(c.linkedin_note)+'</div>';
    h+='<div class="char-count'+(c.linkedin_note.length>200?" over":"")+'">'+c.linkedin_note.length+'/200 chars</div>';
    h+='<div style="display:flex;gap:6px;margin-bottom:8px">';
    h+='<button class="btn btn-purple" onclick="copyBtn(this)" data-text="'+ef(c.linkedin_note)+'" style="flex:1">Copy note</button>';
    if(liUrl) h+='<a href="'+ef(liUrl)+'" target="_blank" rel="noopener" class="btn btn-blue">Open LI</a>';
    h+='</div>';
    if(sid){
      h+='<button class="btn" onclick="generateNote(\''+sid+'\')" '+(state.loadingId?"disabled":"")+' style="width:100%;font-size:11px">';
      h+=lNote?'<span class="spinner"></span>Regenerating...':"Regenerate";
      h+='</button>';
    }
    h+='<div class="divider">';
    h+='<div class="sec-title">What you actually sent <span class="sec-sub">'+(c.note_sent_at?"· "+fd(c.note_sent_at):"")+'</span></div>';
    if(c.note_sent_text){
      h+='<div class="sent-box">'+ef(c.note_sent_text)+'</div>';
      h+='<button class="btn btn-sm" onclick="clearSent(\''+sid+'\',\'note_sent_text\')">Edit</button>';
    } else {
      h+='<textarea id="ns-'+sid+'" placeholder="Paste the exact note you sent..." style="height:55px;font-size:12px;margin-bottom:6px"></textarea>';
      h+='<button class="btn btn-primary" onclick="markNoteSent(\''+sid+'\')" style="width:100%">Mark as sent →</button>';
    }
    h+='</div>';
  } else if(sid){
    h+='<button class="btn btn-purple" onclick="generateNote(\''+sid+'\')" '+(state.loadingId?"disabled":"")+' style="width:100%">';
    h+=lNote?'<span class="spinner"></span>Generating...':"Generate connection note →";
    h+='</button>';
    if(!c.agent08_brief) h+='<div style="font-size:11px;color:var(--text3);margin-top:6px">Tip: run Agent 08 first.</div>';
  } else {
    h+='<div style="font-size:12px;color:var(--text3)">Import contacts first.</div>';
  }
  h+='</div>';

  h+='</div>';

  if(showFU){
    h+='<div class="divider">';
    h+='<div class="sec-title">First message after connecting <span class="sec-sub">(send within 48hrs)</span></div>';
    if(c.followup_msg){
      h+='<div class="note-box">'+ef(c.followup_msg)+'</div>';
      h+='<div style="display:flex;gap:6px;margin-bottom:8px">';
      h+='<button class="btn btn-purple" onclick="copyBtn(this)" data-text="'+ef(c.followup_msg)+'" style="flex:1">Copy message</button>';
      if(liUrl) h+='<a href="'+ef(liUrl)+'" target="_blank" rel="noopener" class="btn btn-blue">Open LI</a>';
      h+='<button class="btn btn-sm" onclick="generateFollowUp(\''+sid+'\')" '+(state.loadingId?"disabled":"")+'>';
      h+=lFU?'<span class="spinner"></span>...':"Regenerate";
      h+='</button>';
      h+='</div>';
      h+='<div class="divider">';
      h+='<div class="sec-title">What you actually sent <span class="sec-sub">'+(c.followup_sent_at?"· "+fd(c.followup_sent_at):"")+'</span></div>';
      if(c.followup_sent_text){
        h+='<div class="sent-box">'+ef(c.followup_sent_text)+'</div>';
        h+='<button class="btn btn-sm" onclick="clearSent(\''+sid+'\',\'followup_sent_text\')">Edit</button>';
      } else {
        h+='<textarea id="fs-'+sid+'" placeholder="Paste the exact message you sent..." style="height:55px;font-size:12px;margin-bottom:6px"></textarea>';
        h+='<button class="btn btn-primary" onclick="markFollowupSent(\''+sid+'\')" style="width:100%">Mark as sent →</button>';
      }
      h+='</div>';
    } else {
      h+='<button class="btn btn-primary" onclick="generateFollowUp(\''+sid+'\')" '+(state.loadingId?"disabled":"")+' style="width:100%">';
      h+=lFU?'<span class="spinner"></span>Writing...':"Generate follow-up message →";
      h+='</button>';
      h+='<div style="font-size:11px;color:var(--text3);margin-top:4px">Personalised message to send after they accept. You send it manually on LinkedIn.</div>';
    }
    h+='</div>';
  }

  if(canPromote){
    h+='<div class="promote-bar">';
    h+='<button class="btn btn-crm" onclick="promoteToDeal(\''+sid+'\')" '+(state.loadingId?"disabled":"")+' style="width:100%">';
    h+=lProm?'<span class="spinner"></span>Promoting...':"→ Promote to CRM deal";
    h+='</button>';
    h+='<div class="promote-hint">Creates a Contacted deal in the CRM with brief and notes pre-filled.</div>';
    h+='</div>';
  }
  if(c.deal_id) h+='<div class="in-crm">Promoted to CRM deal</div>';

  h+='</div></div>';
  return h;
}

function buildBatchBar(src){
  var t1=src.filter(function(c){return c.icp_tier==="1";});
  var done=t1.filter(function(c){return c.agent08_brief&&c.linkedin_note;}).length;
  if(state.batchRunning){
    var pct=state.batchTotal?Math.round((state.batchDone/state.batchTotal)*100):0;
    return '<div class="bar"><div style="flex:1"><div style="font-size:12px;color:var(--text2);margin-bottom:4px">Running... '+state.batchDone+'/'+state.batchTotal+(state.batchCurrent?' — '+ef(state.batchCurrent):'')+'</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:var(--purple)"></div></div></div><span style="font-size:11px;color:var(--text3)">'+pct+'%</span></div>';
  }
  if(done===t1.length&&t1.length>0){
    return '<div class="bar"><div class="alert-green" style="margin:0;flex:1">All '+t1.length+' Tier 1 contacts briefed and notes ready.</div></div>';
  }
  return '<div class="bar"><div style="flex:1;font-size:12px;color:var(--text2)"><strong>'+(t1.length-done)+' Tier 1 contacts</strong> still need briefing.</div><button class="btn btn-purple" onclick="runAllTier1()">Run all Tier 1 →</button></div>';
}

function buildMetrics(src){
  var h='<div class="metrics">';
  for(var i=0;i<STATUS_FLOW.length;i++){
    var s=STATUS_FLOW[i];
    var ss=STATUS_STYLE[s];
    var cnt=src.filter(function(c){return (c.outreach_status||"Not sent")===s;}).length;
    var act=state.filterStatus===s;
    h+='<div class="metric'+(act?" active":"")+'" onclick="setStatusFilter(\''+s+'\')">';
    h+='<div class="metric-label">'+ef(s)+'</div>';
    h+='<div class="metric-value" style="color:'+ss.text+'">'+cnt+'</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function render(){
  var src=state.view==="import"?state.parsed:state.contacts;
  var filt=filtered();
  var t1=src.filter(function(c){return c.icp_tier==="1";}).length;
  var t2=src.filter(function(c){return c.icp_tier==="2";}).length;
  var t3=src.filter(function(c){return c.icp_tier==="3";}).length;
  var br=src.filter(function(c){return c.agent08_brief;}).length;
  var irr=state.contacts.filter(function(c){return c.outreach_status==="Irrelevant";}).length;
  var h="";

  h+='<div class="header">';
  h+='<div style="display:flex;align-items:center;gap:10px">';
  h+='<div class="logo"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M7 2l5 5-5 5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  h+='<span style="font-size:15px;font-weight:500">LinkedIn Outreach</span>';
  h+='<span class="badge">'+src.length+' contacts</span>';
  h+='</div>';
  h+='<div class="tabs">';
  h+='<button class="tab'+(state.view==="import"?" active":"")+'" onclick="switchView(\'import\')">Import CSV</button>';
  h+='<button class="tab'+(state.view==="contacts"?" active":"")+'" onclick="switchView(\'contacts\')">All contacts'+(state.contacts.length?" ("+state.contacts.length+")" :"")+' </button>';
  h+='</div>';
  h+='</div>';

  if(state.view==="import"){
    if(!state.parsed.length){
      h+='<div class="card" style="text-align:center;padding:40px">';
      h+='<div style="font-size:13px;color:var(--text2);margin-bottom:16px">Upload your Apollo CSV export</div>';
      h+='<input type="file" accept=".csv" onchange="onFile(event)" style="font-size:13px">';
      h+='</div>';
    } else {
      h+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px">';
      var stats=[{l:"Total",v:src.length,c:""},{l:"Tier 1",v:t1,c:"#1D9E75"},{l:"Tier 2",v:t2,c:"#EF9F27"},{l:"Tier 3",v:t3,c:"#888780"},{l:"Briefed",v:br,c:"var(--purple)"}];
      for(var si=0;si<stats.length;si++){
        var m=stats[si];
        h+='<div style="background:var(--bg2);border-radius:var(--radius);padding:10px 12px">';
        h+='<div style="font-size:11px;color:var(--text2);margin-bottom:3px">'+m.l+'</div>';
        h+='<div style="font-size:22px;font-weight:500;color:'+(m.c||"var(--text)")+'">'+m.v+'</div>';
        h+='</div>';
      }
      h+='</div>';
      if(!state.imported){
        h+='<div class="bar">';
        if(state.importing){
          h+='<div style="flex:1"><div style="font-size:12px;color:var(--text2);margin-bottom:4px">'+ef(state.phase)+' '+state.progress+'%</div>';
          h+='<div class="progress-track"><div class="progress-fill" style="width:'+state.progress+'%;background:var(--green)"></div></div></div>';
        } else {
          h+='<div style="flex:1;font-size:12px;color:var(--text2)">'+src.length+' contacts parsed. Ready to import.</div>';
          h+='<button class="btn btn-primary" onclick="importContacts()">Import to contacts →</button>';
        }
        h+='</div>';
      } else {
        h+='<div class="alert-green">'+state.importedCount+' new contacts saved · '+state.skippedCount+' already existed.</div>';
      }
      h+=buildBatchBar(state.parsed);
      h+='<div class="toolbar">';
      h+='<input type="text" class="search" placeholder="Search..." value="'+ef(state.search)+'" oninput="state.search=this.value;render()">';
      h+='<div style="display:flex;gap:4px">';
      var tiers=["All","1","2","3"];
      for(var ti=0;ti<tiers.length;ti++){
        var tv=tiers[ti];
        h+='<button class="btn btn-sm'+(state.filterTier===tv?" btn-primary":"")+'" onclick="state.filterTier=\''+tv+'\';render()">'+(tv==="All"?"All":"T"+tv)+'</button>';
      }
      h+='</div>';
      h+='<span style="font-size:11px;color:var(--text3);margin-left:auto">'+filt.length+' shown</span>';
      h+='</div>';
      for(var ci=0;ci<filt.length;ci++) h+=buildCard(filt[ci]);
    }
  } else {
    if(state.phase){
      h+='<div class="empty"><span class="spinner spinner-dark"></span> '+ef(state.phase)+'</div>';
    } else {
      h+=buildMetrics(state.contacts);
      h+=buildBatchBar(state.contacts);
      h+='<div class="toolbar">';
      h+='<input type="text" class="search" placeholder="Search..." value="'+ef(state.search)+'" oninput="state.search=this.value;render()">';
      h+='<div style="display:flex;gap:4px">';
      var tiers2=["All","1","2","3"];
      for(var ti2=0;ti2<tiers2.length;ti2++){
        var tv2=tiers2[ti2];
        h+='<button class="btn btn-sm'+(state.filterTier===tv2?" btn-primary":"")+'" onclick="state.filterTier=\''+tv2+'\';render()">'+(tv2==="All"?"All":"T"+tv2)+'</button>';
      }
      h+='</div>';
      if(irr>0) h+='<button class="btn btn-sm" onclick="state.showIrrelevant=!state.showIrrelevant;render()">'+(state.showIrrelevant?"Hide":"Show")+' irrelevant ('+irr+')</button>';
      h+='<span style="font-size:11px;color:var(--text3);margin-left:auto">'+filt.length+' shown</span>';
      h+='</div>';
      if(filt.length){
        for(var ci2=0;ci2<filt.length;ci2++) h+=buildCard(filt[ci2]);
      } else {
        h+='<div class="empty">No contacts found.</div>';
      }
    }
  }

  document.getElementById("app").innerHTML=h;
}

function toggleExpand(id){ state.expanded=state.expanded==id?null:id; render(); }
function setStatusFilter(s){ state.filterStatus=state.filterStatus===s?"All":s; render(); }
function switchView(v){
  state.view=v; state.search=""; state.filterTier="All"; state.filterStatus="All";
  if(v==="contacts"&&!state.contacts.length) loadContacts();
  else render();
}

render();
</script>
</body>
</html>
